# Private copy of Mezo's MUSD system on Mezo testnet, the matsnet_fuzz setup from mezo-org/musd
[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "london"
optimizer = true
optimizer_runs = 100
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "src/savings/:@openzeppelin/=src/savings/@openzeppelin/",
    "musd/=lib/musd/solidity/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
