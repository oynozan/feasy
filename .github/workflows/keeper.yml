# One keeper pass on the live testnet vault every 15 minutes, needs the KEEPER_PK repository secret
name: keeper

on:
    schedule:
        - cron: "7,22,37,52 * * * *"
    workflow_dispatch:

concurrency:
    group: keeper
    cancel-in-progress: false

jobs:
    keeper:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            KEEPER_PK: ${{ secrets.KEEPER_PK }}
        steps:
            # Without the secret every step skips, so the schedule never fails before the key is added
            - uses: actions/checkout@v4
              if: env.KEEPER_PK != ''
            - uses: foundry-rs/foundry-toolchain@v1
              if: env.KEEPER_PK != ''
            # The keeper's math runs through a plain python command
            - uses: actions/setup-python@v5
              if: env.KEEPER_PK != ''
              with:
                  python-version: "3.12"
            - name: Keeper pass
              if: env.KEEPER_PK != ''
              env:
                  ONCE: "1"
              run: bash scripts/keeper.sh
            # The retired v7 pays its exit queue from veBTC locks that end Nov 12, Nov 19 and Nov 26, even after a failed v8 pass
            - name: Retired v7 pass
              if: ${{ always() && env.KEEPER_PK != '' }}
              env:
                  ONCE: "1"
                  VAULT: "0x4DA2eb6942cF136126A630e4C968CE43474c0Db6"
              run: bash scripts/keeper.sh || true
