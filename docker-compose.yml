# docker compose up -d --build serves the app on http://localhost:5667 and the docs on http://localhost:5668
# Both listen on localhost only, a reverse proxy such as nginx publishes them
services:
    app:
        build:
            context: ./app
            args:
                NEXT_PUBLIC_MEZO_NETWORK: ${MEZO_NETWORK:-testnet}
        ports:
            - "127.0.0.1:${APP_PORT:-5667}:3000"
        restart: unless-stopped
    docs:
        build: ./docs-site
        ports:
            - "127.0.0.1:${DOCS_PORT:-5668}:3000"
        restart: unless-stopped
